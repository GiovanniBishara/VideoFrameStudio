name: Release

# A new version in package.json on main publishes a release: this workflow checks
# that the release v<version> does not exist yet, runs the tests, builds the app and
# creates the release (and its tag) with the files and their checksums.
on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
          echo "$tag"

  build:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build && npm run build:single
      - name: Package
        run: |
          mkdir release
          cp dist-single/VideoFrameStudio.html release/
          (cd dist && zip -qr ../release/VideoFrameStudio-sito.zip .)
      - name: Checksums, so anyone can verify the download
        working-directory: release
        run: sha256sum VideoFrameStudio.html VideoFrameStudio-sito.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release
          path: release

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only this job, only to create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release
          path: release
      - name: Create the release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          REPO: ${{ github.repository }}
        run: >
          gh release create "$TAG" release/VideoFrameStudio.html release/VideoFrameStudio-sito.zip release/SHA256SUMS.txt
          --repo "$REPO" --target "$GITHUB_SHA" --title "VideoFrame & Transcript Studio ${TAG#v}" --notes-file docs/release-notes.md
