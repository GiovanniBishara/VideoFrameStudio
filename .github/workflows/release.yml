name: Release

# Push a version tag (git tag v1.2.0 && git push origin v1.2.0): this workflow
# runs the tests, builds the app and publishes a GitHub release with the files.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build && npm run build:single
      - name: Package
        run: |
          mkdir release
          cp dist-single/VideoFrameStudio.html release/
          (cd dist && zip -qr ../release/VideoFrameStudio-sito.zip .)
      - name: Checksums, so anyone can verify the download
        working-directory: release
        run: sha256sum VideoFrameStudio.html VideoFrameStudio-sito.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release
          path: release

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only this job, only to create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release
          path: release
      - name: Create the release (or update its files)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          files="release/VideoFrameStudio.html release/VideoFrameStudio-sito.zip release/SHA256SUMS.txt"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber --repo "$REPO"
          else
            gh release create "$TAG" $files --repo "$REPO" --title "VideoFrame & Transcript Studio ${TAG#v}" --notes-file docs/release-notes.md
          fi
