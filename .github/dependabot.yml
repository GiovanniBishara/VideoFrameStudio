# Weekly pull requests when a dependency or a GitHub Action has a new version,
# security fixes included. CI (type check, tests, builds, npm audit) runs on each of them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
